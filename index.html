<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Chrono — v2 dopamine</title>
<style>

  :root {
    --bg:#12151c; --panel:#1a1f2b; --panel2:#222838; --line:#2e3548;
    --text:#e8ecf4; --muted:#8a93a8; --accent:#5b8cff; --good:#3ecf8e;
    --bad:#ff6b6b; --warn:#ffd166;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  header {
    display:flex; flex-wrap:wrap; gap:12px; align-items:center;
    padding:14px 18px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  header h1 { font-size:1.25rem; margin:0; letter-spacing:.5px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-left:auto; }
  select, button {
    background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:7px 12px; font-size:.95rem; cursor:pointer;
  }
  button:hover { border-color:var(--accent); }
  #timer {
    font-variant-numeric: tabular-nums; font-size:1.3rem; font-weight:700;
    min-width:86px; text-align:center; padding:6px 10px;
    background:var(--panel2); border:1px solid var(--line); border-radius:8px;
  }
  #timer.low { color:var(--bad); border-color:var(--bad); }
  #status { color:var(--muted); font-size:.9rem; min-height:1.2em; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:18px; padding:18px; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; } }
  section.board {
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px;
  }
  section.board h2 { margin:0 0 10px; font-size:1rem; color:var(--muted); }
  .row { display:grid; grid-template-columns:repeat(5, 62px); gap:6px; margin-bottom:8px; }
  .cell {
    width:62px; height:80px; background:var(--panel2); border:1px solid var(--line);
    border-radius:8px; display:flex; align-items:center; justify-content:center;
  }
  .card {
    width:54px; height:72px; border-radius:6px; background:#f4f6fb; color:#1a1f2b;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-weight:700; font-size:1.15rem; line-height:1.1; user-select:none;
  }
  .card .suit { font-size:1rem; }
  .card.red { color:#b3352c; }
  #board-human .card { cursor:grab; border:2px solid transparent; }
  #board-human .cell.drag-over { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent); }
  .cell.flash { animation:flash .45s ease-out; }
  @keyframes flash { 0% { box-shadow:0 0 0 3px var(--good); } 100% { box-shadow:0 0 0 0 transparent; } }
  .total { margin-top:8px; font-size:.95rem; color:var(--text); }
  .total b { color:var(--accent); font-size:1.1rem; }
  footer { padding:0 18px 22px; }
  #final {
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:18px; max-width:720px; margin:0 auto;
  }
  #final[hidden] { display:none; }
  #final h2 { margin:0 0 10px; }
  .breakdowns { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width: 700px) { .breakdowns { grid-template-columns:1fr; } }
  .bd h3 { font-size:.9rem; color:var(--muted); margin:0 0 6px; }
  .bd .row-line { font-size:.9rem; padding:3px 0; border-bottom:1px dashed var(--line); }
  #final-scores { font-size:1.1rem; margin:12px 0 4px; }
  #best { color:var(--warn); font-size:.9rem; }
  #replay { margin-top:12px; font-size:1rem; padding:9px 18px; }
  #msg { color:var(--warn); font-size:.9rem; min-height:1.3em; text-align:center; padding-top:10px; }

  /* Thème rétro : corps VT323, titres arcade PressStart2P (majuscules). */
  html { font-size: 19px; }
  body {
    font-family: 'VT323', 'Segoe UI', system-ui, sans-serif;
    letter-spacing: .4px;
  }
  /* Scanlines CRT subtiles (sous le canvas FX, au-dessus du contenu). */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 500; pointer-events: none;
    background: repeating-linear-gradient(0deg,
      rgba(0,0,0,.08) 0px, rgba(0,0,0,.08) 1px, transparent 1px, transparent 3px);
  }
  header h1, #final-title {
    font-family: 'PressStart2P', 'VT323', monospace;
    font-size: .78rem; letter-spacing: 1px; text-transform: uppercase;
  }
  select, button, input[type="range"] { font-family: 'VT323', monospace; font-size: 1.05rem; }
  #timer { font-size: 1.5rem; }

  /* Modes couleur : '2' = rouge #b3352c / noir #1a1f2b ;
     '4' = pique noir, cœur rouge, carreau vert, trèfle bleu. */
  body[data-colors="2"] .card.s0,
  body[data-colors="2"] .card.s3 { color: #1a1f2b; }
  body[data-colors="2"] .card.s1,
  body[data-colors="2"] .card.s2 { color: #b3352c; }
  body[data-colors="4"] .card.s0 { color: #1a1f2b; }
  body[data-colors="4"] .card.s1 { color: #b3352c; }
  body[data-colors="4"] .card.s2 { color: #1f9d55; }
  body[data-colors="4"] .card.s3 { color: #2456c9; }

  /* Nom de la main courante, en face de chaque ligne (mis à jour à chaque
     deal et à chaque swap — même fonction évaluatrice que le score). */
  .row { grid-template-columns: 128px repeat(5, 62px); }
  .row-name {
    font-size: 1.05rem; color: var(--muted); align-self: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Contrôles audio (toggles ON/OFF + sliders séparés). */
  .audio-panel { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .audio-panel .audio-btn {
    min-width: 74px; text-align: center; color: var(--muted);
    border-color: var(--line); opacity: .6;
  }
  .audio-panel .audio-btn.on { color: var(--text); opacity: 1; border-color: var(--accent); }
  .vol { display: flex; align-items: center; gap: 6px; font-size: .95rem; color: var(--muted); }
  .vol input[type="range"] { width: 90px; margin: 0; }

  /* Canvas FX plein écran, au-dessus du DOM, ne bloque aucun clic. */
  #fx { position: fixed; inset: 0; z-index: 9999; pointer-events: none; }

  /* Animations « dopamine ». */
  @keyframes deal-in {
    from { transform: translate(46px, -70px) rotate(20deg); opacity: 0; }
    to   { transform: translate(0, 0) rotate(0); opacity: 1; }
  }
  .card.deal-in { animation: deal-in .5s cubic-bezier(.2,.7,.3,1.25) backwards; }
  @keyframes flip-y {
    0% { transform: rotateY(0deg); }
    50% { transform: rotateY(90deg); }
    100% { transform: rotateY(0deg); }
  }
  .card.flip { animation: flip-y .45s ease-in-out; }
  @keyframes glow-fade {
    0% { box-shadow: 0 0 16px rgba(62,207,142,.85); border-color: var(--good); }
    100% { box-shadow: 0 0 0 rgba(62,207,142,0); }
  }
  .row.glow .cell { animation: glow-fade 1.2s ease-out; }
  @keyframes timer-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.07); }
  }
  #timer.pulse { animation: timer-pulse 1s ease-in-out infinite; }
  @keyframes screen-shake {
    10%, 90% { transform: translate(-2px, 1px); }
    20%, 80% { transform: translate(3px, -1px); }
    30%, 70% { transform: translate(-4px, 2px); }
    40%, 60% { transform: translate(4px, -2px); }
    50% { transform: translate(-3px, 1px); }
  }
  main.shake { animation: screen-shake .6s linear; }
</style>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/anim.css">
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<header>
  <h1>Poker Chrono</h1>
  <div class="controls">
    <select id="diff" title="Difficulté de l'IA">
      <option value="facile">Facile</option>
      <option value="normal" selected>Normal</option>
      <option value="difficile">Difficile</option>
    </select>
    <select id="time" title="Temps de la manche (secondes)">
      <option value="10">10 s</option>
      <option value="20" selected>20 s</option>
      <option value="30">30 s</option>
      <option value="60">60 s</option>
    </select>

    <select id="colors" title="Mode de rendu des couleurs">
      <option value="2" selected>2 couleurs</option>
      <option value="4">4 couleurs</option>
    </select>
    <div class="audio-panel">
      <button id="music-toggle" class="audio-btn" type="button" aria-pressed="true">♪ Musique</button>
      <button id="sfx-toggle" class="audio-btn" type="button" aria-pressed="true">SFX</button>
      <label class="vol"><span>Vol. musique</span><input type="range" id="music-vol" min="0" max="100" value="70"></label>
      <label class="vol"><span>Vol. SFX</span><input type="range" id="sfx-vol" min="0" max="100" value="80"></label>
    </div>
    <button id="start" type="button">Jouer</button>
    <div id="timer">--</div>
    <div id="status">Prêt — choisissez la difficulté et le temps.</div>
  </div>
</header>

<main>
  <section class="board" id="board-human">
    <h2>Votre plateau</h2>
    <div class="rows"></div>
    <div class="total">Total : <b id="score-human">0</b> pts</div>
  </section>
  <section class="board" id="board-ai">
    <h2>Plateau de l'IA</h2>
    <div class="rows"></div>
    <div class="total">Total : <b id="score-ai">0</b> pts</div>
  </section>
</main>

<footer>
  <div id="final" hidden>
    <h2 id="final-title"></h2>
    <div class="breakdowns">
      <div class="bd"><h3>Votre plateau</h3><div id="rows-human"></div></div>
      <div class="bd"><h3>Plateau de l’IA</h3><div id="rows-ai"></div></div>
    </div>
    <p id="final-scores"></p>
    <p id="best"></p>
    <button id="replay" type="button">Rejouer</button>
  </div>
  <div id="msg"></div>
</footer>

<script src="js/deck.js"></script>
<script src="js/game.js"></script>
<script id="audio" src="js/audio.js"></script>
<script id="fx" src="js/fx.js"></script>
<script id="ui" src="js/ui.js"></script>
</body>
</html>
