<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poker Chrono — v2 dopamine</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/anim.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<header>
  <h1>Poker Chrono</h1>
  <div class="controls">
    <select id="diff" title="Difficulté de l'IA">
      <option value="facile">Facile</option>
      <option value="normal" selected>Normal</option>
      <option value="difficile">Difficile</option>
    </select>
    <select id="time" title="Temps de la manche (secondes)">
      <option value="10">10 s</option>
      <option value="20" selected>20 s</option>
      <option value="30">30 s</option>
      <option value="60">60 s</option>
    </select>

    <select id="colors" title="Mode de rendu des couleurs">
      <option value="2" selected>2 couleurs</option>
      <option value="4">4 couleurs</option>
    </select>
    <div class="audio-panel">
      <button id="music-toggle" class="audio-btn" type="button" aria-pressed="true">♪ Musique</button>
      <button id="sfx-toggle" class="audio-btn" type="button" aria-pressed="true">SFX</button>
      <label class="vol"><span>Vol. musique</span><input type="range" id="music-vol" min="0" max="100" value="70"></label>
      <label class="vol"><span>Vol. SFX</span><input type="range" id="sfx-vol" min="0" max="100" value="80"></label>
    </div>
    <button id="start" type="button">Jouer</button>
    <div id="timer">--</div>
    <div id="status">Prêt — choisissez la difficulté et le temps.</div>
  </div>
</header>

<main>
  <section class="board" id="board-human">
    <h2>Votre plateau</h2>
    <div class="rows"></div>
    <div class="total">Total : <b id="score-human">0</b> pts</div>
  </section>
  <section class="board" id="board-ai">
    <h2>Plateau de l'IA</h2>
    <div class="rows"></div>
    <div class="total">Total : <b id="score-ai">0</b> pts</div>
  </section>
</main>

<footer>
  <div id="final" hidden>
    <h2 id="final-title"></h2>
    <div class="breakdowns">
      <div class="bd"><h3>Votre plateau</h3><div id="rows-human"></div></div>
      <div class="bd"><h3>Plateau de l’IA</h3><div id="rows-ai"></div></div>
    </div>
    <p id="final-scores"></p>
    <p id="best"></p>
    <button id="replay" type="button">Rejouer</button>
  </div>
  <div id="msg"></div>
</footer>

<script src="js/deck.js"></script>
<script src="js/game.js"></script>
<script id="audio" src="js/audio.js"></script>
<script id="fx" src="js/fx.js"></script>
<script id="ui" src="js/ui.js"></script>
</body>
</html>
